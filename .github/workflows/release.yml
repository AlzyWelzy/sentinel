name: Release

# Push a tag like v0.2.0 to publish images and agent binaries. Then set
# SENTINEL_VERSION / AGENT_VERSION in production.env and redeploy; agents
# update themselves to AGENT_VERSION within a day.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: api/Dockerfile
          - name: ingest
            context: .
            dockerfile: ingest/Dockerfile
          - name: alerter
            context: .
            dockerfile: alerter/Dockerfile
          - name: agent
            context: .
            dockerfile: deploy/agent-container/Dockerfile
          # For probes that run real-browser checks: the agent with Chromium.
          - name: agent-browser
            context: .
            dockerfile: deploy/agent-container/Dockerfile
            args: BROWSER=1
          - name: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag
        id: tag
        # Registry paths must be lower-case (the owner is "AlzyWelzy").
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "agent=$(cat agent/VERSION)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          # The API image carries the agent binaries of agent/VERSION.
          build-args: |
            AGENT_VERSION=${{ steps.tag.outputs.agent }}
            ${{ matrix.args }}
          push: true
          # The agent image is tagged with agent/VERSION (production's
          # AGENT_IMAGE uses AGENT_VERSION), the rest with the release; :latest
          # too, for anyone running the agent container without a version.
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/sentinel-${{ matrix.name }}:${{ startsWith(matrix.name, 'agent') && steps.tag.outputs.agent || steps.tag.outputs.version }}
            ghcr.io/${{ steps.tag.outputs.owner }}/sentinel-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries and checksums
        run: sh scripts/build-agents.sh "$(cat agent/VERSION)" dist
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/*
      # The API image serves the same binaries at /agent/<version>/, so
      # a deployment needs nothing else. The Caddy stack can
      # also serve them from its agent-dist volume or a CDN.
