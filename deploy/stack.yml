# Production stack (Docker Swarm). Every value comes from the environment;
# copy deploy/production.env.example to production.env, fill it in, then:
#
#   set -a; . deploy/production.env; set +a
#   docker stack deploy -c deploy/stack.yml --with-registry-auth sentinel
#
# Never deploy it under the same name as a compose project on the same host
# (the dev compose is "beyond-dev"): volumes are named <name>_<volume>,
# so two deployments with one name share a Postgres data directory.
#
# Migrations run as a one-off job before the services start (DEPLOYMENT.md).
# Public traffic enters through Caddy, which gets TLS certificates for the
# three hostnames automatically: APP_HOST (the web app, and the API under
# /api), INGEST_HOST (agents) and DOWNLOAD_HOST (installers and binaries).

x-pg-app-url: &app_db postgresql+asyncpg://sentinel_app:${SENTINEL_APP_PASSWORD:?}@postgres:5432/sentinel
x-pg-service-url: &service_db_py postgresql+asyncpg://sentinel_service:${SENTINEL_SERVICE_PASSWORD:?}@postgres:5432/sentinel
x-pg-service-url-go: &service_db_go postgres://sentinel_service:${SENTINEL_SERVICE_PASSWORD:?}@postgres:5432/sentinel

x-deploy: &rolling
  update_config:
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    order: start-first
  restart_policy:
    condition: any
    delay: 5s

services:
  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    environment:
      APP_HOST: ${APP_HOST:?}
      INGEST_HOST: ${INGEST_HOST:?}
      DOWNLOAD_HOST: ${DOWNLOAD_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
    networks: [edge]
    deploy: *rolling

  api:
    image: ${REGISTRY:-ghcr.io/alzywelzy}/sentinel-api:${SENTINEL_VERSION:?}
    environment:
      ENVIRONMENT: production
      DATABASE_APP_URL: *app_db
      DATABASE_SERVICE_URL: *service_db_py
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      TEMPO_URL: http://tempo:3200
      VICTORIAMETRICS_LONG_URL: http://victoriametrics-long:8428
      API_ROOT_PATH: /api
      PUBLIC_APP_URL: https://${APP_HOST}
      PUBLIC_API_URL: https://${APP_HOST}/api
      PUBLIC_INGEST_URL: https://${INGEST_HOST}
      PUBLIC_DOWNLOAD_URL: https://${DOWNLOAD_HOST}
      AGENT_VERSION: ${AGENT_VERSION:?}
      AGENT_IMAGE: ${REGISTRY:-ghcr.io/alzywelzy}/sentinel-agent:${AGENT_VERSION:?}
      CORS_ORIGINS: ""
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_SECRET_PREVIOUS: ${AUTH_SECRET_PREVIOUS:-}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CAPTCHA_DISABLED: ${CAPTCHA_DISABLED:-false}
      ENABLED_CHANNEL_TYPES: ${ENABLED_CHANNEL_TYPES:-email,push,webhook,slack,teams,discord,telegram}
      PROBE_ACCOUNT_IDS: ${PROBE_ACCOUNT_IDS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      ACK_SIGNING_SECRET: ${ACK_SIGNING_SECRET:-}
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      <<: *rolling
      replicas: 2

  ingest:
    image: ${REGISTRY:-ghcr.io/alzywelzy}/sentinel-ingest:${SENTINEL_VERSION:?}
    environment:
      DATABASE_URL: *service_db_go
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      TEMPO_URL: http://tempo:4318
      PUBLIC_INGEST_URL: https://${INGEST_HOST}
      PUBLIC_DOWNLOAD_URL: https://${DOWNLOAD_HOST}
      AGENT_VERSION: ${AGENT_VERSION:?}
    networks: [edge, backend]
    deploy:
      <<: *rolling
      replicas: 2

  alerter:
    image: ${REGISTRY:-ghcr.io/alzywelzy}/sentinel-alerter:${SENTINEL_VERSION:?}
    environment:
      DATABASE_URL: *service_db_go
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIALOGS_URL: http://victorialogs:9428
      PUBLIC_APP_URL: https://${APP_HOST}
      PUBLIC_API_URL: https://${APP_HOST}/api
      ACK_SIGNING_SECRET: ${ACK_SIGNING_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?}
    networks: [backend]
    deploy:
      <<: *rolling
      # Two replicas: one evaluates, the other waits on the advisory lock.
      replicas: 2

  # Monthly reports, hourly metric rollups, cleanup and agent rollouts
  # (python -m app.jobs). Extra replicas stand by on an advisory lock.
  jobs:
    image: ${REGISTRY:-ghcr.io/alzywelzy}/sentinel-api:${SENTINEL_VERSION:?}
    command: ["python", "-m", "app.jobs"]
    environment:
      ENVIRONMENT: production
      AGENT_VERSION: ${AGENT_VERSION:?}
      AGENT_CANARY_PERCENT: ${AGENT_CANARY_PERCENT:-10}
      DATABASE_APP_URL: *app_db
      DATABASE_SERVICE_URL: *service_db_py
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIAMETRICS_LONG_URL: http://victoriametrics-long:8428
      PUBLIC_APP_URL: https://${APP_HOST}
      AUTH_SECRET: ${AUTH_SECRET:?}
      CAPTCHA_DISABLED: "true"   # the worker serves no sign-ups
    networks: [backend]
    deploy:
      <<: *rolling
      replicas: 1

  # The web app (Next.js). Server-side code reaches the API on the private
  # network; browsers reach it at https://APP_HOST/api.
  web:
    image: ${REGISTRY:-ghcr.io/alzywelzy}/sentinel-web:${SENTINEL_VERSION:?}
    environment:
      API_INTERNAL_URL: http://api:8000
      PUBLIC_APP_URL: https://${APP_HOST}
    networks: [edge, backend]
    deploy:
      <<: *rolling
      replicas: 2

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      SENTINEL_APP_PASSWORD: ${SENTINEL_APP_PASSWORD:?}
      SENTINEL_SERVICE_PASSWORD: ${SENTINEL_SERVICE_PASSWORD:?}
    configs:
      - source: init_roles
        target: /docker-entrypoint-initdb.d/10-init-roles.sh
        mode: 0555
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

  # Nightly pg_dump of Sentinel's database, kept BACKUP_KEEP_DAYS (see
  # postgres/backup.sh for restoring).
  backup:
    image: postgres:18.6-alpine
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    configs:
      - source: backup_script
        target: /backup.sh
      - source: restore_check
        target: /restore-check.sh
    volumes:
      - pg-backups:/backups
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/storage
      # Retried pushes resend samples: keep one per series and timestamp.
      - -dedup.minScrapeInterval=1ms
      - -retentionPeriod=${METRICS_RETENTION:-90d}
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

  # Hourly rollups, kept for years (written by jobs).
  victoriametrics-long:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/storage
      - -dedup.minScrapeInterval=1ms
      - -retentionPeriod=${LONG_METRICS_RETENTION:-2y}
      - -httpListenAddr=:8428
    volumes:
      - vm-long-data:/storage
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

  # Log search: each account is its own VictoriaLogs AccountID.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=${LOG_RETENTION:-14d}
      - -httpListenAddr=:9428
    volumes:
      - vlogs-data:/vlogs
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

  # APM traces: one Tempo tenant per account (multitenancy_enabled).
  tempo:
    image: grafana/tempo:3.1.1
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    configs:
      - source: tempo
        target: /etc/tempo/tempo.yml
    volumes:
      - tempo-data:/var/tempo
    networks: [backend]
    deploy:
      placement:
        constraints: [node.labels.sentinel.db == true]

configs:
  backup_script:
    name: sentinel-backup-${BACKUP_SCRIPT:-v1}
    file: ./postgres/backup.sh
  restore_check:
    name: sentinel-restore-check-${RESTORE_CHECK:-v1}
    file: ./postgres/restore-check.sh
  tempo:
    # Swarm configs can't change in place: name each version by its content
    # (set by the deploy, e.g. TEMPO_CONFIG=$(sha256sum tempo/tempo.yml | cut -c1-8)).
    name: sentinel-tempo-${TEMPO_CONFIG:-v1}
    file: ./tempo/tempo.yml
  caddyfile:
    file: ./caddy/Caddyfile
  init_roles:
    file: ./postgres/init-roles.sh

volumes:
  caddy-data:
  postgres-data:
  pg-backups:
  redis-data:
  vm-data:
  vm-long-data:
  vlogs-data:
  tempo-data:

networks:
  edge:
    driver: overlay
  backend:
    driver: overlay
    # Nothing on this network is published. Attachable so one-off jobs
    # (migrations, vm-backup.sh) can reach the stores.
    attachable: true
