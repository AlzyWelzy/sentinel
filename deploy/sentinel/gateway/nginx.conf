# Sentinel's front door, on the LAN only (172.23.2.15:80). The prod console's
# edge forwards the public Pulsegrid paths here; the console backend calls
# /internal directly. Nothing on this host is published to the internet.
worker_processes auto;
events { worker_connections 4096; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_max_body_size 50m;
  proxy_read_timeout 300s;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  # The console edge sets X-Forwarded-For; trust it only from the console host.
  set_real_ip_from 172.23.1.160;
  real_ip_header X-Forwarded-For;

  server {
    listen 80 default_server;
    location = /__gateway { return 200 "sentinel ok\n"; }

    # console backend -> Pulsegrid service routes: console host only.
    location /api/pulsegrid/internal/ {
      allow 172.23.1.160;
      deny all;
      set $up http://pulsegrid-api:8000;
      proxy_pass $up;
      proxy_set_header Host $host;
    }
    location /api/pulsegrid {
      set $up http://pulsegrid-api:8000;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /pulsegrid/ingest/ {
      set $up http://pulsegrid-ingest:8080;
      rewrite ^/pulsegrid/ingest/(.*)$ /$1 break;
      proxy_pass $up;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
  }
}
