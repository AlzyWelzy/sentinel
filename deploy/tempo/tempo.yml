# Tempo 3 for Pulsegrid APM (single binary, local disk). multitenancy_enabled
# makes every request name its tenant (X-Scope-OrgID = the Pulsegrid account
# id): ingest writes with it, the API reads with it. TraceQL metrics (request
# rate, errors, latency percentiles) come from the live store for the last few
# minutes and from the stored blocks for anything older, so they reach back
# over the whole retention and survive a restart (Tempo 3 has no local-blocks
# processor; this replaces it).
multitenancy_enabled: true
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

backend_worker:
  compaction:
    block_retention: 168h # 7 days

metrics_generator:
  storage:
    path: /var/tempo/generator/wal

query_frontend:
  metrics:
    max_duration: 169h
    query_backend_after: 5m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 5000000
      burst_size_bytes: 10000000
      max_traces_per_user: 20000
    global:
      max_bytes_per_trace: 5000000

usage_report:
  reporting_enabled: false
