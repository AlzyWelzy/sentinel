name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform-provider:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform-provider-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform-provider-sentinel/go.mod
          cache-dependency-path: terraform-provider-sentinel/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || (gofmt -l $(git ls-files '*.go') && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile and vet the agent for every released platform
        run: |
          for target in linux/amd64 linux/arm64 freebsd/amd64 freebsd/arm64 openbsd/amd64 \
                        netbsd/amd64 windows/amd64 windows/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./agent/...
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./agent
          done

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: The typed client matches the API
        run: |
          (cd ../api && uv sync --locked)
          npm run api
          git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The collector reads real OS counters, so run its tests on real Windows and
  # macOS too (Linux runs in the job above).
  agent-native:
    strategy:
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./agent/...

  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-retries 20
      redis:
        image: redis:8.10.3-alpine
        ports: ["6389:6379"]
      # Process, check and chart endpoints are tested against real queries.
      victoriametrics:
        image: victoriametrics/victoria-metrics:v1.155.0
        ports: ["8438:8428"]
    env:
      PGPASSWORD: sentinel
      DATABASE_OWNER_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5442/sentinel
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - name: Create database roles
        working-directory: .
        env:
          POSTGRES_USER: sentinel
          POSTGRES_DB: sentinel
          SENTINEL_APP_PASSWORD: sentinel_app
          SENTINEL_SERVICE_PASSWORD: sentinel_service
        # init-roles.sh calls psql without a host; point it at the service.
        run: PGHOST=localhost PGPORT=5442 sh deploy/postgres/init-roles.sh
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Downgrade and upgrade again
        run: uv run alembic downgrade base && uv run alembic upgrade head

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh -n api/app/install.sh
      - run: shellcheck -s sh api/app/install.sh deploy/postgres/init-roles.sh
      - name: PowerShell installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/api/app/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
