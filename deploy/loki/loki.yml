# Loki for Pulsegrid log search. auth_enabled makes every request name its
# tenant (X-Scope-OrgID = the Pulsegrid account id): ingest writes with it
# and the API reads with it, so accounts can't see each other's lines.
auth_enabled: true

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 336h # 14 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_line_size: 16KB
  max_streams_per_user: 5000
  max_query_length: 337h
  max_entries_limit_per_query: 1000
  allow_structured_metadata: false

analytics:
  reporting_enabled: false
