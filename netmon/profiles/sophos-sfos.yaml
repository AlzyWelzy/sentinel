name: sophos-sfos
vendor: Sophos
description: Sophos Firewall (SFOS-FIREWALL-MIB; verified on XGS126, SFOS 20.0.2).
extends: [_host_resources, _routing]
match:
  sys_object_id: [1.3.6.1.4.1.2604.5]
inventory:
  model: {oid: 1.3.6.1.4.1.2604.5.1.1.2.0}       # sfosDeviceType
  os_version: {oid: 1.3.6.1.4.1.2604.5.1.1.3.0}  # sfosDeviceFWVersion
  serial: {oid: 1.3.6.1.4.1.2604.5.1.1.4.0}
scalars:
  - {name: disk_capacity_bytes, oid: 1.3.6.1.4.1.2604.5.1.2.4.1.0, scale: 1048576}
  - {name: disk_usage_percent, oid: 1.3.6.1.4.1.2604.5.1.2.4.2.0}
  - {name: memory_capacity_bytes, oid: 1.3.6.1.4.1.2604.5.1.2.5.1.0, scale: 1048576}
  - {name: memory_usage_percent, oid: 1.3.6.1.4.1.2604.5.1.2.5.2.0}
  - {name: swap_usage_percent, oid: 1.3.6.1.4.1.2604.5.1.2.5.4.0}
  - {name: live_users, oid: 1.3.6.1.4.1.2604.5.1.2.6.0}
alerts:
  - name: Sophos disk almost full
    expr: beacon_disk_usage_percent{profile="sophos-sfos"} > 90
    for: 15m
    severity: warning
    summary: '{{ $labels.device }} disk at {{ $value }}%'
  - name: Sophos memory high
    expr: beacon_memory_usage_percent{profile="sophos-sfos"} > 95
    for: 10m
    severity: warning
    summary: '{{ $labels.device }} memory at {{ $value }}%'
