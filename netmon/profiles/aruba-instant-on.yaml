name: aruba-instant-on
vendor: HPE Aruba
description: Aruba Instant On 1930 switches. The agent exposes IF-MIB, LLDP and ENTITY inventory only (no CPU or sensors).
extends: [_entity, _routing]
match:
  sys_object_id: [1.3.6.1.4.1.11.2.3.7.11]
  sys_descr: 'Instant On'
inventory:
  model: {oid: 1.3.6.1.2.1.1.1.0, regex: '(JL\w+)'}
  os_version: {oid: 1.3.6.1.2.1.1.1.0, regex: 'InstantOn_\w+?_([0-9.]+)'}
