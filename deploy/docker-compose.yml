# Local development stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The project name must differ from the production stack's: Docker names
# volumes <project>_<volume>, so a shared name would point both at the same
# Postgres data directory.
name: pulsegrid-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pulsegrid
      POSTGRES_USER: pulsegrid          # owner: runs migrations, owns the tables
      POSTGRES_PASSWORD: pulsegrid
      PULSEGRID_APP_PASSWORD: pulsegrid_app
      PULSEGRID_SERVICE_PASSWORD: pulsegrid_service
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegrid -d pulsegrid"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=90d
      - -httpListenAddr=:8428
    volumes:
      - vm-data:/storage
    ports:
      - "127.0.0.1:${VM_PORT:-8428}:8428"

  victoriametrics-long:
    image: victoriametrics/victoria-metrics:v1.106.1
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=2y
      - -httpListenAddr=:8428
    volumes:
      - vm-long-data:/storage
    ports:
      - "127.0.0.1:${VM_LONG_PORT:-8429}:8428"

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"

  migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_OWNER_URL: postgresql+asyncpg://pulsegrid:pulsegrid@postgres:5432/pulsegrid
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      ENVIRONMENT: development
      ALLOW_AUTH_BYPASS: "true"
      DATABASE_APP_URL: postgresql+asyncpg://pulsegrid_app:pulsegrid_app@postgres:5432/pulsegrid
      DATABASE_SERVICE_URL: postgresql+asyncpg://pulsegrid_service:pulsegrid_service@postgres:5432/pulsegrid
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL:-http://localhost:8080}
      PUBLIC_DOWNLOAD_URL: ${PUBLIC_DOWNLOAD_URL:-http://localhost:8000}
      AGENT_VERSION: ${AGENT_VERSION:-dev}
      INTERNAL_API_KEY: change-me-pulsegrid-internal-key
      ACK_SIGNING_SECRET: change-me-ack-secret
      VICTORIAMETRICS_LONG_URL: http://victoriametrics-long:8428
      LOKI_URL: http://loki:3100
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:5173/monitoring?tab=servers}
      ENABLED_CHANNEL_TYPES: ${ENABLED_CHANNEL_TYPES:-email,push,webhook}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PROBE_ACCOUNT_IDS: ${PROBE_ACCOUNT_IDS:-00000000-0000-0000-0000-000000000001}
      # Browser origins allowed to call the API: the console's domain(s).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Console identity; same values as billing-ms in the same environment.
      JWKS_URI: ${JWKS_URI:-http://localhost/.well-known/jwks.json}
      JWT_TOKEN_ISSUER: ${JWT_TOKEN_ISSUER:-issuer.client.com}
      JWT_TOKEN_AUDIENCE: ${JWT_TOKEN_AUDIENCE:-audience.client.com}
    volumes:
      - ../api/dist:/app/dist:ro   # `make agent` output, served at /agent/
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ingest:
    build:
      context: ..
      dockerfile: ingest/Dockerfile
    environment:
      DATABASE_URL: postgres://pulsegrid_service:pulsegrid_service@postgres:5432/pulsegrid
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      LOKI_URL: http://loki:3100
      PUBLIC_INGEST_URL: ${PUBLIC_INGEST_URL:-http://localhost:8080}
      PUBLIC_DOWNLOAD_URL: ${PUBLIC_DOWNLOAD_URL:-http://localhost:8000}
      AGENT_VERSION: ${AGENT_VERSION:-dev}
    ports:
      - "${INGEST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  alerter:
    build:
      context: ..
      dockerfile: alerter/Dockerfile
    environment:
      DATABASE_URL: postgres://pulsegrid_service:pulsegrid_service@postgres:5432/pulsegrid
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:5173/monitoring}
      EVALUATION_INTERVAL_SECONDS: ${EVALUATION_INTERVAL_SECONDS:-30}
      # Local mail goes to Mailpit (UI on MAILPIT_PORT); set real SMTP in production.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: Pulsegrid <alerts@pulsegrid.local>
      WEBHOOK_SIGNING_SECRET: change-me-webhook-secret
      ACK_SIGNING_SECRET: change-me-ack-secret
      PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      ALLOW_PRIVATE_WEBHOOKS: "true"   # local only: lets webhooks reach localhost test receivers
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  jobs:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.jobs"]
    environment:
      ENVIRONMENT: development
      DATABASE_APP_URL: postgresql+asyncpg://pulsegrid_app:pulsegrid_app@postgres:5432/pulsegrid
      DATABASE_SERVICE_URL: postgresql+asyncpg://pulsegrid_service:pulsegrid_service@postgres:5432/pulsegrid
      REDIS_URL: redis://redis:6379/0
      VICTORIAMETRICS_URL: http://victoriametrics:8428
      VICTORIAMETRICS_LONG_URL: http://victoriametrics-long:8428
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-http://localhost:5173/monitoring?tab=servers}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres-data:
  vm-data:
  vm-long-data:
  loki-data:
