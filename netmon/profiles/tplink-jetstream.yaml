name: tplink-jetstream
extends: [_routing]
vendor: TP-Link
description: TP-Link JetStream / Omada managed switches. GetBulk returns nothing on these agents, so walks use GetNext; the private MIB tree is too slow to walk.
match:
  sys_object_id: [1.3.6.1.4.1.11863]
  sys_descr: '^(JetStream|Omada) '
snmp:
  use_getnext: true
  skip_roots: [1.3.6.1.4.1.11863]
inventory:
  model: {oid: 1.3.6.1.2.1.1.1.0, regex: '^((?:JetStream|Omada) \d+-Port[^,]*)'}
