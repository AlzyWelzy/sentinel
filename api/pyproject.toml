[project]
name = "sentinel-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.13.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "dnspython>=2.9.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.7",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "pyyaml>=6.0.2",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008"]  # FastAPI's Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]
# Local-dev defaults (overridden by env in every deployment) and Redis key names.
"app/config.py" = ["S105"]
"app/services/heartbeats.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
