# Test-server override: trust the dev console's real JWTs. The dev console's
# nginx routes by Host, so map its hostname to the dev box's private IP.
#   docker compose -f deploy/docker-compose.yml -f deploy/testing/console-dev.override.yml up -d
services:
  api:
    extra_hosts:
      - "dev.Example.com:172.23.2.17"
