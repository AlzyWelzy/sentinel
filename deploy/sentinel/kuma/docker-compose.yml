# Uptime Kuma for the prod console's monitoring module, moved from console
# (core_uptime_kuma) and console_db (kuma_db) on 2026-10-27. Reached by the
# console backend at http://172.23.2.15:3001 (LAN only).
services:
  db:
    image: mariadb:12.3.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      # run mariadb-upgrade when the image is a newer version than the data
      MARIADB_AUTO_UPGRADE: "1"
    volumes: [db:/var/lib/mysql]
    ports: ["127.0.0.1:3306:3306"]
    healthcheck: {test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 10s, retries: 10}
  kuma:
    image: louislam/uptime-kuma:2.5.8
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    volumes: [data:/app/data]
    ports: ["172.23.2.15:3001:3001"]
volumes:
  db:
  data:
